# NAS 部署配置（连接已有的外部 PG 和 Redis）
# 用法：docker compose -f docker-compose.nas.yml --env-file .env.nas up -d
# 停止：docker compose -f docker-compose.nas.yml down

services:
  # =========================================
  # 1. 后端 (Spring Boot)
  # =========================================
  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: interview-app
    restart: unless-stopped
    environment:
      # 连接外部 PostgreSQL（NAS 上已有的服务）
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-interview_guide}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      # 连接外部 Redis（NAS 上已有的服务）
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT:-6379}

      # NAS 上已有的 MinIO（S3 兼容存储）
      APP_STORAGE_MODE: s3
      APP_STORAGE_ENDPOINT: ${APP_STORAGE_ENDPOINT}
      APP_STORAGE_ACCESS_KEY: ${APP_STORAGE_ACCESS_KEY}
      APP_STORAGE_SECRET_KEY: ${APP_STORAGE_SECRET_KEY}
      APP_STORAGE_BUCKET: ${APP_STORAGE_BUCKET:-interview-guide}
      APP_STORAGE_REGION: ${APP_STORAGE_REGION:-us-east-1}
      APP_STORAGE_AUTO_CREATE_BUCKET: ${APP_STORAGE_AUTO_CREATE_BUCKET:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1}

      # AI 配置
      AI_BAILIAN_API_KEY: ${AI_BAILIAN_API_KEY}
      AI_MODEL: ${AI_MODEL:-qwen3.5-flash}
      APP_AI_CONFIG_ENCRYPTION_KEY: ${APP_AI_CONFIG_ENCRYPTION_KEY}
      APP_AI_CONFIG_YAML_PATH: /data/config/llm-providers.yml
      APP_AI_CONFIG_ENV_PATH: /data/config/llm-providers.env

      # 面试参数
      APP_INTERVIEW_FOLLOW_UP_COUNT: ${APP_INTERVIEW_FOLLOW_UP_COUNT:-1}
      APP_INTERVIEW_EVALUATION_BATCH_SIZE: ${APP_INTERVIEW_EVALUATION_BATCH_SIZE:-8}

      # 语音面试（可选）
      APP_VOICE_USER_UTTERANCE_DEBOUNCE_MS: ${APP_VOICE_USER_UTTERANCE_DEBOUNCE_MS:-1600}
      APP_VOICE_ASR_SILENCE_MS: ${APP_VOICE_ASR_SILENCE_MS:-1000}

      # JVM 参数
      JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx1024m}
    volumes:
      - ./data/config:/data/config
    ports:
      - "${APP_PORT:-8080}:8080"

  # =========================================
  # 2. 前端 (Nginx)
  # =========================================
  frontend:
    build: ./frontend
    container_name: interview-frontend
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${FRONTEND_PORT:-80}:80"
